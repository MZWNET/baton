[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base16ct = { version = "1", features = ["alloc"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
baton-adapters = { path = "crates/baton-adapters" }
baton-core = { path = "crates/baton-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
hostname = "0.4"
jiff = "0.2"
md-5 = { version = "0.11", default-features = false }
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5", "v7"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
