name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-26-intel
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-musl

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-${{ matrix.target }}"
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # A tag names a release, and any other build is a preview named after its commit
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version=$GITHUB_REF_NAME; else version=${GITHUB_SHA::7}; fi
          mkdir -p dist package
          cp README.md LICENSE package/
          cd package
          archive=../dist/baton-$version-${{ matrix.target }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp ../target/${{ matrix.target }}/release/baton.exe .
            7z a "$archive.zip" baton.exe README.md LICENSE
          else
            cp ../target/${{ matrix.target }}/release/baton .
            tar -czf "$archive.tar.gz" baton README.md LICENSE
          fi

      # Uploaded as is, so the download is the archive itself instead of a zip around it
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*
          archive: false

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Without skip-decompress the Windows archive would arrive extracted
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
