name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-26-intel
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: Linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-${{ matrix.target }}"
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist package
          cp README.md LICENSE package/
          cd package
          archive=../dist/baton-${{ github.ref_name }}-${{ matrix.target }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp ../target/${{ matrix.target }}/release/baton.exe .
            7z a "$archive.zip" baton.exe README.md LICENSE
          else
            cp ../target/${{ matrix.target }}/release/baton .
            tar -czf "$archive.tar.gz" baton README.md LICENSE
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: baton-${{ github.ref_name }}-${{ matrix.name }}
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
